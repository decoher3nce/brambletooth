<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Asymmetric isometric arena game." />
    <title>Brambletooth</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #1a2421;
        color: #fff;
        font-family: system-ui, sans-serif;
      }
      #game {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
      }
      #boot {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="boot">Loading Brambletooth…</div>
    <script type="module">
      // Remove the boot message once main loads
      import("./src/main.ts").then(() => {
        const el = document.getElementById("boot");
        if (el) el.remove();
      }).catch((err) => {
        const el = document.getElementById("boot");
        if (el) el.textContent = "Load error: " + err.message;
        console.error(err);
      });
    </script>
  </body>
</html>
